<style>
:root{--paper:#f6f7f9;--card:#fff;--ink:#0c1a30;--muted:#4f5b6e;--rule:#d3d9e2;--navy:#0b1b33;--navy2:#13294a;--blue:#1d4f91;--brass:#4b2380;--acc:#1d4f91;--panel:#fff;--mut:#4f5b6e;--line:#d3d9e2;
--ok:#1b7a6a;--run:#1d4f91;--pend:#a8473f;--dec:#4b2380;--na:#7b879a;--tbc:#9aa5b6;
--serif:"Source Serif 4",Georgia,serif;--sans:"IBM Plex Sans",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0a1424;--card:#101e35;--ink:#e9eef6;--muted:#9fb0c8;--rule:#26354f;--blue:#7fb0f0;--brass:#b9a0ec;--ok:#4fc3ad;--run:#7fb0f0;--pend:#e58a82;--dec:#b9a0ec;--na:#8fa0b8;--tbc:#6f7f98}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.6 var(--sans)}
a{color:var(--blue)}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{width:min(1100px,100% - 2.5rem);margin-inline:auto}
/* login */
#gate{min-height:100dvh;display:grid;place-items:center;background:var(--navy);padding:1.25rem}
.gbox{background:var(--card);width:min(420px,100%);padding:2rem}
.gbox img{height:48px;margin:0 0 1.25rem;background:#fff}
.gbox h1{font:600 1.5rem/1.2 var(--serif);margin:0 0 .4rem}.gbox p{color:var(--muted);margin:0 0 1.2rem;font-size:.95rem}
.gbox label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:.3rem}
.gbox input{font:inherit;width:100%;min-height:46px;padding:.5rem .7rem;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);margin-bottom:1rem}
.btn{font:inherit;font-weight:600;cursor:pointer;border:1.5px solid var(--navy);background:var(--navy);color:#fff;padding:.7rem 1.3rem;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.err{color:#b8402b;font-size:.9rem;min-height:1.3em;margin:-.4rem 0 .6rem}
/* topo */
.bar{background:#fff;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.6rem}
.bar img{height:44px}.bar nav{display:flex;gap:1.4rem;align-items:center;font-size:.93rem}
.bar nav a{color:#4f5b6e;text-decoration:none}.bar nav a:hover{color:#0c1a30}
.bar .btn.ghost{color:#0c1a30;border-color:#0c1a30;min-height:40px;padding:.4rem .9rem}
.who{font-size:.85rem;color:#4f5b6e}
.hero{background:var(--navy);color:#f2f5fa;padding:clamp(2rem,5vw,3.5rem) 0}
.hero h1{font:600 clamp(1.8rem,4vw,2.9rem)/1.1 var(--serif);margin:0 0 .7rem;max-width:22ch}
.hero p{color:#b4c0d3;margin:0;max-width:60ch}
.tag{display:inline-block;font-size:.8rem;border:1px solid #b4c0d3;color:#d6e0ef;padding:.15rem .6rem;margin-bottom:1rem}
.sec{padding-block:clamp(2.2rem,5vw,3.5rem);border-bottom:1px solid var(--rule)}
h2.t{font:600 clamp(1.5rem,2.6vw,2rem)/1.15 var(--serif);margin:0 0 .5rem}
.lead{color:var(--muted);margin:0 0 1.5rem;max-width:70ch}
.panel{background:var(--card);border:1px solid var(--rule);padding:1.2rem 1.4rem}
.panel h3{margin:0 0 .7rem;font-size:1rem;font-weight:600}
/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.9rem;margin-bottom:1.5rem}
.kpi{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--c);padding:.8rem 1rem}
.kpi b{font:600 1.9rem/1 var(--serif);display:block}.kpi span{font-size:.85rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.4rem}
.bars{display:grid;gap:.7rem}
.brow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:.8rem;align-items:center;font-size:.93rem}
.brow .nm{line-height:1.3}.brow .nm small{display:block;color:var(--muted);font-size:.8rem}
.track{height:.8rem;background:var(--rule);position:relative}.fill{height:100%;background:var(--c);width:var(--w)}
.chip{font-size:.78rem;font-weight:600;padding:.12rem .55rem;border:1.5px solid var(--c);color:var(--c);white-space:nowrap}
.donutw{display:grid;place-items:center}.donutw svg{width:min(220px,100%)}
.leg{list-style:none;margin:.8rem 0 0;padding:0;font-size:.9rem}
.leg li{display:flex;gap:.5rem;align-items:center;margin-bottom:.25rem}.leg i{width:.8rem;height:.8rem;background:var(--c);display:inline-block}
.final{margin-top:1.5rem;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--brass);padding:1.1rem 1.4rem}
.final h3{margin:0 0 .4rem;font-size:1.05rem}.final p{margin:0 0 .5rem}
/* linha do tempo */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:7.4rem;top:.4rem;bottom:.4rem;width:2px;background:var(--rule)}
.tl li{display:grid;grid-template-columns:6.4rem 1.6rem minmax(0,1fr);gap:0 .6rem;padding:.55rem 0;align-items:start}
.tl .d{text-align:right;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:.15rem}
.tl .dot{width:.9rem;height:.9rem;border-radius:50%;background:var(--c);margin:.35rem auto 0;position:relative;z-index:1;box-shadow:0 0 0 3px var(--paper)}
.tl .tx b{display:block}.tl .tx span{font-size:.88rem;color:var(--muted)}
.tl .st{font-size:.75rem;font-weight:600;color:var(--c);margin-left:.4rem}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem}
.card{background:var(--card);border:1px solid var(--rule);padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.5rem}
.card h3{margin:0;font:600 1.15rem/1.25 var(--serif)}.card p{margin:0;color:var(--muted);font-size:.93rem}
.card .meta{font-size:.85rem;color:var(--muted)}
.card a.btn{align-self:flex-start;text-decoration:none;margin-top:auto;font-size:.9rem;min-height:42px;padding:.5rem 1rem}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:.7rem .9rem;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{background:var(--paper);color:var(--muted);font-size:.85rem}.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.news{margin:.6rem 0 0;padding-left:1.1rem}.news li{margin:.3rem 0}.news a{color:inherit;text-decoration:underline}
.note{font-size:.88rem;color:var(--muted);margin-top:1rem;max-width:80ch}
footer{padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.88rem}
.hide{display:none!important}
@media (max-width:820px){.cols{grid-template-columns:1fr}.bar nav a{display:none}.brow{grid-template-columns:1fr auto}.brow .track{grid-column:1/-1;order:3}
.tl::before{left:5.6rem}.tl li{grid-template-columns:4.6rem 1.6rem minmax(0,1fr)}}


.dcb{font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border:1.5px solid var(--acc);background:transparent;color:var(--acc);padding:.25rem .65rem;white-space:nowrap;text-decoration:none;display:inline-block;border-radius:0}
.dcb:hover{background:var(--acc);color:#fff}.dcb.z{border-color:var(--line);color:var(--mut);cursor:default}.dcb.z:hover{background:transparent;color:var(--mut)}
dialog{border:0;padding:0;width:min(580px,calc(100% - 2rem));background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,10,14,.6)}
.dh{display:flex;justify-content:space-between;gap:1rem;padding:1.2rem 1.4rem;border-bottom:2px solid var(--ink)}
.dh h2{margin:0;font-size:1.3rem;line-height:1.2}.dh p{margin:.2rem 0 0;color:var(--mut);font-size:.9rem}.dh .ob{color:var(--ink)}
.dx{all:unset;cursor:pointer;font-size:1.8rem;line-height:1;padding:0 .3rem}.dx:focus-visible{outline:3px solid var(--acc)}
.dl{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
.dl li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 1.4rem;border-bottom:1px solid var(--line)}
.dl small{display:block;color:var(--mut);font-size:.8rem}
.dl .btn{padding:.35rem .9rem;min-height:36px;font-size:.85rem;text-decoration:none}

.brow .dcb{margin-top:.35rem}.st.z{color:var(--muted)}
@media (prefers-color-scheme:dark){:root{--panel:#101e35;--acc:#7fb0f0;--line:#26354f;--mut:#9fb0c8}}

#rep.hide,#main.hide,#stf.hide,#desp.hide{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}.tabs button{font:600 .9rem var(--sans);background:#fff;color:var(--ink);border:1px solid var(--rule);padding:9px 16px;cursor:pointer}.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.wel{grid-column:1/-1;background:#fff;border:1px solid var(--rule);padding:26px 28px;max-width:760px}.wel h3{margin:22px 0 8px}.wel h3:first-child{margin-top:0}.wel ol{margin:0 0 4px 20px;padding:0}.wel li{margin:6px 0}.wel p{margin:0 0 8px}.wel .ass{margin-top:22px;color:var(--ink)}
.mnav{display:none}@media(max-width:820px){.mnav{display:block;padding:.6rem 16px;background:var(--paper);border-bottom:1px solid var(--rule)}.mnav a{display:block;text-align:center;text-decoration:none}}
.rsub{position:sticky;top:var(--hh,60px);z-index:7;background:var(--panel,#fff);border-bottom:1px solid var(--line,var(--rule));box-shadow:0 1px 0 var(--line,var(--rule))}
.rsub .in{width:min(1140px,100% - 2rem);margin-inline:auto;display:flex;gap:.3rem 1.1rem;align-items:center;flex-wrap:wrap;padding:.55rem 0;font-size:.9rem}
.rsub a,.rsub button{font:inherit;color:var(--ink);text-decoration:none;background:none;border:0;padding:.2rem 0;cursor:pointer}
.rsub a:hover,.rsub button:hover{color:var(--acc)}
.rsub .vol{font-weight:700}.rsub .sp{margin-left:auto;display:flex;gap:.6rem;align-items:center}
.rsub .on{font-weight:700;border-bottom:2px solid var(--acc)}
.rsub .pdf{border:1.5px solid var(--ink);padding:.25rem .7rem;font-weight:600}

.gbox{box-shadow:0 24px 70px rgba(0,0,0,.45)}
.gcap{position:absolute;left:0;right:0;bottom:1.5rem;text-align:center;color:#e6edf7;font-size:.9rem;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.gcap b{display:block;font:600 1.15rem var(--serif);margin-bottom:.15rem}
#gate{position:relative}
.sobre{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.1rem}.sobre>div{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--blue);padding:1.1rem 1.3rem}.sobre h3{margin:0 0 .4rem;font:600 1.05rem var(--serif)}.sobre p{margin:0;color:var(--muted);font-size:.93rem}@media(max-width:820px){.sobre{grid-template-columns:1fr}}.hero .wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:2rem;align-items:end}
.hcta{display:flex;flex-direction:column;align-items:flex-start;gap:1rem;justify-self:end;border-left:3px solid #b9a0ec;padding-left:1.4rem}
.hdias b{display:block;font:600 clamp(3.4rem,8vw,5.6rem)/.9 var(--serif);font-variant-numeric:tabular-nums;color:#fff}
.hdias span{font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:#b4c0d3}
.hdias small{display:block;color:#8fa0b8;font-size:.82rem;margin-top:.2rem}
a.wa{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;text-decoration:none;border:1.5px solid #fff;color:#fff;padding:.55rem 1rem;min-height:44px}
a.wa:hover{background:#fff;color:#0b1b33}
.bar a.wa{border-color:#0c1a30;color:#0c1a30;padding:.3rem .8rem;min-height:40px}.bar a.wa:hover{background:#0c1a30;color:#fff}
footer a{color:inherit}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hcta{justify-self:start}}
.tbl td small{display:block;color:var(--muted);font-size:.82rem;margin-top:.15rem}
:root{--sv:#1b7a6a;--so:#d9651b;--sr:#c0392b}
@media (prefers-color-scheme:dark){:root{--sv:#4fc3ad;--so:#f09a5c;--sr:#ef7a6e}}
i.sem{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;margin-right:.5rem;vertical-align:-1px;background:var(--sem)}
i.sem.v{--sem:var(--sv)}i.sem.o{--sem:var(--so)}i.sem.r{--sem:var(--sr)}
.brow[data-sem=v]{--c:var(--sv)}.brow[data-sem=o]{--c:var(--so)}.brow[data-sem=r]{--c:var(--sr)}
.sm3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;margin:0 0 1.2rem}
.sm3 .k{background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--c);padding:1rem 1.2rem}
.sm3 .k b{font:600 2.4rem/1 var(--serif);display:block}.sm3 .k span{font-weight:600;display:block;margin-top:.2rem}.sm3 .k small{display:block;color:var(--muted);margin-top:.25rem;font-size:.85rem}
.l3{display:grid;gap:.7rem}
.l3 .r{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--c);padding:.9rem 1.2rem}
.l3 .r h3{margin:0 0 .25rem;font-size:1rem;font-weight:700}.l3 .r p{margin:0;color:var(--ink)}.l3 .r p+p{margin-top:.4rem;color:var(--muted);font-size:.92rem}
.ent{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-top:1.4rem}
.ent div{background:var(--card);border:1px solid var(--rule);padding:.8rem 1rem}.ent b{font:600 1.9rem/1 var(--serif);display:block}.ent span{font-size:.85rem;color:var(--muted)}
.leg3{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;font-size:.88rem;color:var(--muted);margin:0 0 1.2rem}
.rtag{display:inline-block;font-size:.78rem;font-weight:700;padding:.12rem .55rem;border:1.5px solid var(--c);color:var(--c);white-space:nowrap}
.rtag.v{--c:var(--sv)}.rtag.o{--c:var(--so)}.rtag.r{--c:var(--sr)}
.tbl.w td,.tbl.w th{font-size:.9rem}.tbl td.nm2{font-weight:600}
@media (max-width:820px){.sm3{grid-template-columns:1fr}}

/* tabelas em cartões no celular */
@media (max-width:700px){
 .scroll{overflow:visible}
 .scroll>table.tbl{min-width:0;width:100%;border:0;background:transparent;display:block}
 .scroll>table.tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 .scroll>table.tbl tbody{display:block}
 .scroll>table.tbl tr{display:block;background:var(--card);border:1px solid var(--rule);margin:0 0 .85rem}
 .scroll>table.tbl td{display:block;position:relative;width:auto;border:0;border-bottom:1px solid var(--rule);padding:.55rem .9rem .55rem 38%;min-height:2.2rem;overflow-wrap:anywhere}
 .scroll>table.tbl td:last-child{border-bottom:0}
 .scroll>table.tbl td::before{content:attr(data-label);position:absolute;left:.9rem;top:.62rem;width:31%;color:var(--muted);font-size:.76rem;font-weight:600;line-height:1.4}
 .scroll>table.tbl td:first-child{width:auto;background:var(--paper);font-weight:700;padding:.7rem .9rem}
 .scroll>table.tbl td:first-child::before{content:none}
 .scroll>table.tbl td:empty{display:none}
 .rtag{white-space:normal}
 .cols{grid-template-columns:minmax(0,1fr)}
 .panel{min-width:0;overflow-wrap:anywhere}
}

.ult{background:var(--card);border:1px solid var(--rule);margin:0 0 1rem}
.ult>h3{margin:0;padding:.75rem 1.1rem;background:var(--paper);border-bottom:1px solid var(--rule);font:600 1.05rem var(--serif)}
.ult .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.ult .g4>div{padding:.9rem 1.1rem;border-right:1px solid var(--rule);border-top:4px solid var(--c)}
.ult .g4>div:last-child{border-right:0}
.ult h4{margin:0 0 .5rem;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.ult ul{margin:0;padding-left:1.05rem}.ult li{margin:.3rem 0;font-size:.92rem;overflow-wrap:anywhere}
@media (max-width:820px){.ult .g4{grid-template-columns:minmax(0,1fr)}.ult .g4>div{border-right:0;border-bottom:1px solid var(--rule)}.ult .g4>div:last-child{border-bottom:0}}
</style>

      var pdf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},await aes(kp,["decrypt"]),b.slice(12));
      var url=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"}));
      if(w)w.location=url;else location.href=url;
    }catch(e){if(w)w.close()}
  };
  try{sessionStorage.setItem("perfil",perfil);var all=new Uint8Array(K.length+(kp?kp.length:0));all.set(K);if(kp)all.set(kp,K.length);sessionStorage.setItem("vk",JSON.stringify({t:t,k:u2b(all),p:perfil}))}catch(_){}
  document.open();document.write(html);document.close();
}
async function entrar(pw){
  var V=await vault();var p=pw.trim().toLowerCase();
  for(var i=0;i<V.v.length;i++){
    var e=V.v[i];
    try{
      var base=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);
      var dk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(e.s),iterations:V.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
      var plain=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(e.i)},dk,b2u(e.w)));
      var perfil=await sha("ironman703se|"+p);
      await abrir(plain.slice(0,32),plain.length>32?plain.slice(32,64):null,e.t,perfil);return true;
    }catch(_){}
  }
  return false;
}
